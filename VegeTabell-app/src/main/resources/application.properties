spring.application.name=VegeTabell-app

# Supabase (PostgreSQL) 接続設定（Session pooler。共通部分のみ。パスワードは application-local.properties か環境変数で上書き）
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.vrrrxhmpwscxsbwarhne
spring.datasource.password=

# Supabase Session poolerは共有の接続プールのため、アプリ側(Hikari)のプールは小さめに絞る
# （テスト実行時に複数のSpringコンテキストが同時にHikariプールを開くと接続数が枯渇しやすいための対策）
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Security: セッションタイムアウト（auth-design.md仕様、30分・暫定値）
server.servlet.session.timeout=30m
