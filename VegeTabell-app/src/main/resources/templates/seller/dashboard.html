<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ダッシュボード | VegeTabell</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="seller-page page-with-nav">
    <div class="seller-header">
        <div class="shop-avatar">🏪</div>
        <div class="seller-header-name">
            <p class="shop-name" th:text="${shop.shopName}">店舗名</p>
            <p class="shop-role-label">出品アカウント</p>
        </div>
        <a th:href="@{/notifications}" class="bell-button">
            🔔
            <span class="bell-badge" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">1</span>
        </a>
    </div>

    <h2 class="section-title">本日の状況</h2>
    <div class="stat-cards">
        <div class="stat-card">
            <p class="stat-label">本日出品アイテム</p>
            <p class="stat-value" th:text="${todayListedCount} + ' 点'">0 点</p>
        </div>
        <div class="stat-card">
            <p class="stat-label">レスキュー完了（売上）</p>
            <p class="stat-value" th:text="'¥' + ${#numbers.formatInteger(completedRevenue, 1, 'COMMA')}">¥0</p>
        </div>
    </div>

    <p class="auth-message error" th:if="${cancelError != null}" th:text="${cancelError}"></p>

    <h2 class="section-title">予約一覧</h2>
    <div class="reservation-list">
        <p class="empty-state" th:if="${#lists.isEmpty(reservations)}">現在、予約は入っていません</p>
        <div class="reservation-card" th:each="r : ${reservations}">
            <div>
                <p class="reservation-product-name" th:text="${r.productName}">商品名</p>
                <p class="reservation-meta">
                    <span th:text="${r.buyerDisplayName}">買い手名</span>
                    <span th:text="${r.quantity} + '点'">1点</span>
                    <span th:text="${r.pickupWindowLabel}">本日16:00〜19:00まで</span>
                </p>
            </div>
            <form th:action="@{/reservations/{id}/cancel(id=${r.id})}" method="post"
                  onsubmit="return confirm('この予約をキャンセルしますか？');">
                <button type="submit" class="btn-link btn-link-danger">キャンセルする</button>
            </form>
        </div>
    </div>

    <div class="section-title-row">
        <h2 class="section-title">現在の出品状況</h2>
        <a th:href="@{/seller/products}" class="section-link">すべて見る</a>
    </div>

    <div class="product-list">
        <p class="empty-state" th:if="${#lists.isEmpty(products)}">まだ出品がありません</p>
        <div th:each="p : ${products}">
            <div th:replace="~{seller/fragments :: productCard(${p})}"></div>
        </div>
    </div>

    <a th:href="@{/seller/products/new}" class="btn-fab btn-fab-above-nav">＋ 商品を登録する</a>

    <div th:replace="~{fragments/nav :: sellerNav('home')}"></div>
</div>
</body>
</html>
