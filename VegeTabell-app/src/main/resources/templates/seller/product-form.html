<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新しく出品する | VegeTabell</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="seller-page">
    <div class="page-header">
        <a th:href="@{/seller/products}" class="back-link">←</a>
        <h1 class="page-title">新しく出品する</h1>
    </div>

    <p class="auth-message error" th:if="${uploadError != null}" th:text="${uploadError}"></p>

    <form th:action="@{/seller/products}" th:object="${productForm}" method="post" enctype="multipart/form-data">
        <div class="field">
            <label class="photo-upload" for="photo">
                <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp,image/gif"
                       onchange="previewPhoto(event)">
                <span class="photo-upload-placeholder" id="photoUploadPlaceholder">
                    <svg th:replace="~{fragments/icons :: icon('camera')}"></svg>
                    <span>商品の写真を撮影・アップロード</span>
                </span>
                <img id="photoPreview" class="photo-upload-preview" alt="" hidden>
            </label>
            <p class="field-error" th:if="${#fields.hasErrors('photo')}" th:errors="*{photo}"></p>
        </div>

        <div class="field">
            <label for="name">商品名</label>
            <input type="text" id="name" th:field="*{name}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="field">
            <label for="description">商品説明（任意）</label>
            <textarea id="description" th:field="*{description}" rows="3"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        </div>

        <div class="field">
            <label for="categoryId">カテゴリー</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option value="">選択してください</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.icon} + ' ' + ${category.name}">野菜</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></p>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="normalPrice">通常価格（円）</label>
                <input type="number" min="0" id="normalPrice" th:field="*{normalPrice}">
                <p class="field-error" th:if="${#fields.hasErrors('normalPrice')}" th:errors="*{normalPrice}"></p>
            </div>
            <div class="field">
                <label for="rescuePrice">レスキュー価格（円）</label>
                <input type="number" min="0" id="rescuePrice" th:field="*{rescuePrice}">
                <p class="field-error" th:if="${#fields.hasErrors('rescuePrice')}" th:errors="*{rescuePrice}"></p>
            </div>
        </div>

        <div class="field">
            <label for="expiryAt">引取期限・消費期限</label>
            <input type="datetime-local" id="expiryAt" th:field="*{expiryAt}">
            <p class="field-error" th:if="${#fields.hasErrors('expiryAt')}" th:errors="*{expiryAt}"></p>
        </div>

        <div class="field">
            <label for="totalQuantity">出品個数</label>
            <input type="number" min="1" id="totalQuantity" th:field="*{totalQuantity}">
            <p class="field-error" th:if="${#fields.hasErrors('totalQuantity')}" th:errors="*{totalQuantity}"></p>
        </div>

        <button type="submit" class="btn-primary" data-loading-text="出品中...">出品する</button>
    </form>
</div>
<script th:src="@{/js/photo-preview.js}"></script>
<script th:src="@{/js/form-lock.js}"></script>
</body>
</html>
