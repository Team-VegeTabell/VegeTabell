<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<svg th:fragment="icon(name)" class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true">
    <g th:if="${name == 'home'}">
        <path d="M3 10.5 12 3l9 7.5"/>
        <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
    </g>
    <g th:if="${name == 'search'}">
        <circle cx="11" cy="11" r="6"/>
        <path d="M20 20l-4.35-4.35"/>
    </g>
    <g th:if="${name == 'bell'}">
        <path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9Z"/>
        <path d="M9.5 17a2.5 2.5 0 0 0 5 0"/>
    </g>
    <g th:if="${name == 'user'}">
        <circle cx="12" cy="8" r="3.5"/>
        <path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/>

    <g th:if="${name == 'list'}">

    <g th:if="${name == 'settings'}">
        <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/>

        <line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="18" r="2"/>
    </g>
    <g th:if="${name == 'grid'}">
        <rect x="4" y="4" width="7" height="7" rx="1.5"/>
        <rect x="13" y="4" width="7" height="7" rx="1.5"/>
        <rect x="4" y="13" width="7" height="7" rx="1.5"/>
        <rect x="13" y="13" width="7" height="7" rx="1.5"/>
    </g>
    <g th:if="${name == 'leaf'}">
        <path d="M4 20C4 11 10 4 20 4c0 10-7 16-16 16Z"/>
        <path d="M6 18c2.5-5 6-8.5 11-11"/>

        <circle cx="12" cy="14" r="6.5"/>
        <path d="M12 7.5V4.5"/>
        <path d="M12 4.5c1.2-1.2 2.5-.8 2.5-.8"/>

    <g th:if="${name == 'bread'}">
        <path d="M4 20v-8c0-4.4 3.6-8 8-8s8 3.6 8 8v8H4Z"/>
        <path d="M4 20h16"/>

    <g th:if="${name == 'bento'}">
        <rect x="4" y="6" width="16" height="13" rx="2"/>
        <path d="M4 12h16M11 6v13"/>
    </g>
    <g th:if="${name == 'camera'}">
        <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/>
        <circle cx="12" cy="13" r="3.5"/>
    </g>

</body>
</html>
